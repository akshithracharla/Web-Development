<!DOCTYPE html>
<html>
<head>
<title>Responsive Website</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

nav{
    background:#333;
    padding:15px;
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
}

.nav-links{
    list-style:none;
    display:flex;
    gap:20px;
}

.nav-links a{
    color:white;
    text-decoration:none;
}

.nav-links a:hover{
    color:orange;
}

.nav-container{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.menu-btn{
    display:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.hero{
    text-align:center;
    padding:50px;
}

.cards{
    display:flex;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    width:250px;
    border-radius:10px;
    box-shadow:0 0 10px lightgray;
}


@media(max-width:768px){

    .menu-btn{
        display:block;
    }

    .nav-links{
        display:none;
        flex-direction:column;
        width:100%;
        margin-top:10px;
    }

    .nav-links.active{
        display:flex;
    }

    .nav-container{
        flex-direction:column;
        align-items:flex-start;
    }

    .cards{
        flex-direction:column;
        align-items:center;
    }
}


@media(min-width:769px) and (max-width:1024px){

    .cards{
        flex-wrap:wrap;
    }
}

</style>
</head>

<body>

<nav>
    <div class="nav-container">

        <div class="logo">My Website</div>

        <div class="menu-btn" onclick="toggleMenu()">
            ☰
        </div>

        <ul class="nav-links" id="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </div>
</nav>

<section class="hero">
    <h1>Responsive Web Design</h1>
    <p>Works on Mobile, Tablet and Desktop</p>
</section>

<div class="cards">

    <div class="card">
        <h2>HTML</h2>
        <p>Structure of web pages.</p>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>Styling and responsiveness.</p>
    </div>

    <div class="card">
        <h2>JavaScript</h2>
        <p>Interactivity and dynamic behavior.</p>
    </div>

</div>

<script>

function toggleMenu(){
    document.getElementById("menu")
            .classList.toggle("active");
}

</script>

</body>
</html>
