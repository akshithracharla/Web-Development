<!DOCTYPE html>
<html>
<head>
    <title>My Web Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background-color:#f4f4f4;
        }

        nav{
            background:#333;
            padding:15px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 20px;
            font-size:18px;
            padding:8px 15px;
        }

        nav a:hover{
            background:orange;
            border-radius:5px;
        }

        .container{
            text-align:center;
            padding:40px;
        }

        h1{
            color:#333;
            margin-bottom:20px;
        }

        p{
            margin-bottom:20px;
            color:#555;
        }

        img{
            width:300px;
            border-radius:10px;
            margin-bottom:20px;
        }

        form{
            background:white;
            width:300px;
            margin:auto;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:100%;
            padding:10px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <h1>Welcome to My Website</h1>

        <p>
            This webpage is created using HTML and CSS
            for Primeor Solutions Internship Task.
        </p>

        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085"
             alt="Web Development">

        <form>
            <input type="text" placeholder="Enter Your Name">
            <button type="submit">Submit</button>
        </form>
       
    </div>

</body>
</html>
